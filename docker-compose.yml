services:
  db:
    image: postgres:16-alpine
    container_name: ai-bid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_bid
      POSTGRES_USER: ai_bid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ai_bid -d ai_bid"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: ai-bid-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","96mb","--maxmemory-policy","noeviction"]
    volumes: ["redis_data:/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    container_name: ai-bid-mvp
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    environment:
      NODE_ENV: production
      PORT: 3100
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://ai_bid:${POSTGRES_PASSWORD}@db:5432/ai_bid
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET}
    volumes: ["./data:/app/data"]
    mem_limit: 512m
    cpus: 1.5
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:3100/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ai_bid:${POSTGRES_PASSWORD}@db:5432/ai_bid
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY}
      AI_THINKING: ${AI_THINKING:-disabled}
      SUB2API_BASE_URL: http://sub2api:8080
      SUB2API_API_KEY: ${SUB2API_API_KEY}
      SUB2API_USAGE_DATABASE_URL: ${SUB2API_USAGE_DATABASE_URL}
      AI_MODEL: deepseek-v4-pro
    volumes: ["./data:/app/data"]
    mem_limit: 1024m
    cpus: 1.5
    networks:
      - default
      - sub2api-network
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  db_data:
  redis_data:
networks:
  sub2api-network:
    external: true
    name: sub2api_sub2api-network
